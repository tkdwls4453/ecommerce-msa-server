server:
  port: 8080

spring:
  main:
    web-application-type: reactive
  application:
    name: gateway-server

eureka:
  instance:
    lease-renewal-interval-in-seconds: 10
    lease-expiration-duration-in-seconds: 30
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://admin:1234@${EUREKA_SERVER_HOST:localhost}:8761/eureka