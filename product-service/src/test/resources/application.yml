spring:
  application:
    name: product-service
  jpa:
    defer-datasource-initialization: false
  sql:
    init:
      mode: never
eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://admin:1234@${EUREKA_SERVER_HOST:localhost}:8761/eureka